[project]
name = "genetic-perplexity-optimizer"
version = "0.1.0"
description = "Genetic algorithm optimizer for Kaggle Santa 2024 perplexity permutations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal==0.67.25",
    "numpy==2.1.3",
    "optimizer==0.1.0",
    "pandas==2.2.3",
    "transformers==4.46.3",
    "wandb==0.19.0",
]

[dependency-groups]
dev = [
    "dvc==3.67.1",
    "ruff==0.8.2",
]


[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) codes by default
# select = ["E", "F", "I", "B", "W", "C"]
# ignore = []
extend-exclude = [".venv"]

# Same as Black.
line-length = 88
indent-width = 4

# Target Python 3.12 for lint rule compatibility.
target-version = "py312"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Enable rules specific to scientific stack (numpy, pandas)
extend-select = ["NPY", "PD"]
ignore = ["NPY002"]

[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google-style docstrings

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files

[tool.ruff.lint.isort]
known-first-party = ["genetic"]
